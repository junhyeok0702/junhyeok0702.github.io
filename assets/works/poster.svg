<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="포스터: 밝은 배경에 파란 원과 선으로 구성한 경영과 정보의 교차점 전시 포스터">
  <title>경영과 정보의 교차점</title>
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .sans { font-family: "IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
    <clipPath id="frame">
      <rect x="40" y="40" width="520" height="720" rx="18"/>
    </clipPath>
  </defs>

  <!-- 배경 -->
  <rect width="600" height="800" fill="#f6f7f9"/>
  <rect x="40" y="40" width="520" height="720" rx="18" fill="#ffffff" stroke="rgba(20,24,33,.1)" stroke-width="1"/>

  <!-- 상단 빛 번짐 -->
  <g clip-path="url(#frame)">
    <circle cx="300" cy="80" r="260" fill="#3358e0" opacity="0.06"/>
  </g>

  <!-- 상단 라벨 -->
  <text x="72" y="104" class="mono" font-size="15" letter-spacing="3" fill="#5a6273">03 — WORKS / POSTER</text>
  <line x1="72" y1="120" x2="528" y2="120" stroke="rgba(20,24,33,.1)" stroke-width="1"/>

  <!-- 기하 구성: 원과 사각형의 교차 -->
  <g clip-path="url(#frame)">
    <circle cx="245" cy="320" r="120" fill="none" stroke="#3358e0" stroke-width="2"/>
    <rect x="245" y="200" width="200" height="200" fill="#3358e0" opacity="0.12"/>
    <rect x="245" y="200" width="200" height="200" fill="none" stroke="#3358e0" stroke-width="2"/>
    <circle cx="245" cy="320" r="7" fill="#3358e0"/>
    <circle cx="445" cy="320" r="7" fill="#3358e0"/>
    <line x1="245" y1="320" x2="445" y2="320" stroke="#3358e0" stroke-width="2" stroke-dasharray="4 6"/>
  </g>

  <!-- 제목 -->
  <text x="72" y="545" class="sans" font-size="46" font-weight="700" fill="#141821">경영과</text>
  <text x="72" y="600" class="sans" font-size="46" font-weight="700" fill="#141821">정보의 교차점</text>

  <!-- 본문 -->
  <text x="72" y="648" class="sans" font-size="17" fill="#5a6273">데이터와 비즈니스를 잇는 작은 실험들</text>

  <!-- 하단 메타 -->
  <line x1="72" y1="690" x2="528" y2="690" stroke="rgba(20,24,33,.1)" stroke-width="1"/>
  <text x="72" y="722" class="mono" font-size="14" letter-spacing="1" fill="#5a6273">박준혁 · 국민대학교 경영정보학부</text>
  <text x="528" y="722" class="mono" font-size="14" letter-spacing="1" fill="#3358e0" text-anchor="end">KMU MIS</text>
</svg>
